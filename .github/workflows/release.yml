name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. v0.2.0)"
        required: true

jobs:
  # Creates the draft release exactly once. Without this gate, each entry of
  # the matrix below would race to call "create release" via tauri-action,
  # producing one duplicate draft per losing racer (GitHub's "find-or-create"
  # API is not atomic against concurrent callers). The matrix jobs then
  # upload into the single release id this job outputs.
  create-release:
    name: create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag_name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        id: create
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.tag.outputs.name }}
        with:
          script: |
            const { TAG } = process.env;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: TAG,
              name: `eir ${TAG}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    name: build (${{ matrix.label }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Tauri on Linux pulls in WebKitGTK, AppIndicator, and librsvg through
      # the system package manager. These aren't preinstalled on the GitHub
      # runner image, so the build fails at the WebView link step without
      # them. WebView2 on Windows and WKWebView on macOS are system-provided,
      # so only Linux needs this step.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artefacts (.app.tar.gz / .nsis.zip / .AppImage
          # .tar.gz + latest.json) with the ed25519 keypair whose public half
          # lives in tauri.conf.json. Without this secret, tauri-action skips
          # updater signing and the in-app "Check for updates" flow won't
          # verify the download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing. tauri-cli imports the .p12 into a
          # throwaway keychain and derives the signing identity from the
          # certificate itself, so no APPLE_SIGNING_IDENTITY is needed (and
          # tauri.conf.json must NOT pin one: a value that disagrees with the
          # certificate is a hard error). Ignored on Linux/Windows.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Notarization runs inside tauri-cli (notarytool + stapler) when
          # these three are present — no separate notarize action needed. It
          # happens before the updater .app.tar.gz is packed, so the payload
          # the updater installs carries a stapled ticket too. Adds a few
          # minutes to the macOS jobs while Apple's service processes it.
          # Note it only covers the .app — see the DMG step below.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Upload into the draft the create-release job already made rather
          # than triggering tauri-action's own "find or create" path (which
          # races across parallel matrix jobs and produces duplicate drafts).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Updater .sig assets still upload per job, but latest.json is
          # assembled once by the updater-manifest job below. Each matrix job
          # rewriting it concurrently is a lost-update race that dropped the
          # Windows entries in v0.17.5. (The previous `includeUpdaterJson`
          # input here was a typo for uploadUpdaterJson and silently ignored.)
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }}

      # tauri-cli notarizes the .app but only *signs* the .dmg it then wraps it
      # in, so a freshly downloaded image is still refused on open ("Apple cannot
      # check it for malicious software") even though the app inside is fine —
      # v0.17.6 shipped that way until the DMGs were notarized by hand. Notarize
      # and staple the image itself and replace the asset tauri-action already
      # uploaded. `stapler staple` fails when Apple did not accept the
      # submission, so a rejection fails the job instead of passing quietly.
      - name: Notarize and staple the DMG
        if: startsWith(matrix.os, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          echo "notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          gh release upload "$TAG" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

      # tauri-cli degrades silently on both halves of this: no APPLE_CERTIFICATE
      # means an ad-hoc signature, and no APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID
      # means notarization is skipped. Either way the job stays green while
      # shipping a bundle macOS refuses to exec after an in-place update — AMFI
      # rejected the ad-hoc binary in v0.17.5 with "adhoc signed or signed by an
      # unknown certificate chain", which is what broke relaunch. So assert
      # against the built artifact rather than trusting the inputs.
      - name: Verify macOS signature and notarization
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/eir.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" > codesign.txt 2>&1
          cat codesign.txt
          grep -q "Authority=Developer ID Application:" codesign.txt \
            || { echo "::error::not signed with a Developer ID certificate (APPLE_CERTIFICATE secret missing?)"; exit 1; }
          grep -q "flags=.*runtime" codesign.txt \
            || { echo "::error::hardened runtime not enabled"; exit 1; }
          xcrun stapler validate "$APP" \
            || { echo "::error::no stapled notarization ticket (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID secrets missing?)"; exit 1; }
          spctl --assess --type execute -vvv "$APP"
          # The image users actually download. `--type install` is the assessment
          # macOS runs when a quarantined DMG is opened, so this is the check that
          # would have caught v0.17.6's un-notarized DMGs.
          DMG=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          xcrun stapler validate "$DMG" \
            || { echo "::error::DMG has no stapled ticket — it will be refused on open"; exit 1; }
          spctl --assess --type install -vvv "$DMG"

  # The matrix jobs used to each download-merge-reupload latest.json. Those
  # unsynchronised read-modify-write cycles race, and the last writer clobbers
  # whichever platform entries it never saw — all four builds still report
  # success, so the broken manifest is invisible in CI. Building the manifest
  # exactly once, after every upload finished, removes the race and fails
  # loudly if any platform's updater artifact or signature is missing.
  updater-manifest:
    name: assemble updater manifest
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          release_id = os.environ["RELEASE_ID"]
          tag = os.environ["TAG"]

          def gh(*args):
              out = subprocess.run(["gh", "api", *args], check=True, capture_output=True)
              return out.stdout.decode()

          assets = json.loads(gh(f"repos/{repo}/releases/{release_id}/assets?per_page=100"))
          by_name = {a["name"]: a for a in assets}

          # Updater artifact suffix -> latest.json platform keys, mirroring
          # what tauri-action wrote for v0.17.4. The .sig sibling holds the
          # signature; the API asset URL is what the in-app updater fetches
          # (works for drafts and stays valid after publishing).
          MAPPING = [
              ("_aarch64.app.tar.gz", ["darwin-aarch64", "darwin-aarch64-app"]),
              ("_x64.app.tar.gz", ["darwin-x86_64", "darwin-x86_64-app"]),
              ("_amd64.AppImage", ["linux-x86_64", "linux-x86_64-appimage"]),
              ("_amd64.deb", ["linux-x86_64-deb"]),
              (".x86_64.rpm", ["linux-x86_64-rpm"]),
              (".msi", ["windows-x86_64", "windows-x86_64-msi"]),
              ("-setup.exe", ["windows-x86_64-nsis"]),
          ]

          platforms = {}
          missing = []
          for suffix, keys in MAPPING:
              artifact = next((a for a in assets if a["name"].endswith(suffix)), None)
              sig = by_name.get(artifact["name"] + ".sig") if artifact else None
              if artifact is None or sig is None:
                  missing.append(suffix)
                  continue
              signature = gh(
                  f"repos/{repo}/releases/assets/{sig['id']}",
                  "-H", "Accept: application/octet-stream",
              ).strip()
              for key in keys:
                  platforms[key] = {"signature": signature, "url": artifact["url"]}

          if missing:
              raise SystemExit(f"updater artifacts missing for suffixes: {missing}")

          manifest = {
              "version": tag.lstrip("v"),
              "notes": "",
              "pub_date": datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"latest.json assembled with {len(platforms)} platform entries")

          # Reruns of this job would otherwise hit "asset already exists".
          if "latest.json" in by_name:
              gh("--method", "DELETE",
                 f"repos/{repo}/releases/assets/{by_name['latest.json']['id']}")
          gh("--method", "POST",
             "-H", "Content-Type: application/json",
             "--input", "latest.json",
             f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name=latest.json")
          PY
